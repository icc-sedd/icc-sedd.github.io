name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
    
    - name: Verify secrets are configured
      env:
        REACT_APP_GOOGLE_API_KEY: ${{ secrets.REACT_APP_GOOGLE_API_KEY }}
        REACT_APP_GOOGLE_SHEET_ID: ${{ secrets.REACT_APP_GOOGLE_SHEET_ID }}
        REACT_APP_RSVP_ENDPOINT: ${{ secrets.REACT_APP_RSVP_ENDPOINT }}
      run: |
        if [ -z "$REACT_APP_GOOGLE_API_KEY" ]; then echo "ERROR: REACT_APP_GOOGLE_API_KEY secret not set" && exit 1; fi
        if [ -z "$REACT_APP_GOOGLE_SHEET_ID" ]; then echo "ERROR: REACT_APP_GOOGLE_SHEET_ID secret not set" && exit 1; fi
        if [ -z "$REACT_APP_RSVP_ENDPOINT" ]; then echo "ERROR: REACT_APP_RSVP_ENDPOINT secret not set" && exit 1; fi
        echo "✓ All required secrets are configured"
      
    - name: Generate gallery manifest
      run: npm run generate-gallery
      
    - name: Build
      run: npm run build
      env:
        # These secrets are embedded in the React build at compile time
        # The API key is safe to expose as it's restricted to your domain in Google Cloud Console
        REACT_APP_GOOGLE_API_KEY: ${{ secrets.REACT_APP_GOOGLE_API_KEY }}
        REACT_APP_GOOGLE_SHEET_ID: ${{ secrets.REACT_APP_GOOGLE_SHEET_ID }}
        REACT_APP_RSVP_ENDPOINT: ${{ secrets.REACT_APP_RSVP_ENDPOINT }}
      
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
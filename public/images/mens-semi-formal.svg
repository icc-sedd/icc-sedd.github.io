<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="suitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shirtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tieGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8941f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f6f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eae5df;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="url(#backgroundGradient)"/>
  
  <!-- Subtle border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#d4af37" stroke-width="2" rx="15" opacity="0.3"/>
  
  <!-- Suit Jacket -->
  <path d="M 80 120 L 220 120 L 235 140 L 235 320 L 200 340 L 100 340 L 65 320 L 65 140 Z" fill="url(#suitGradient)" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Lapels -->
  <path d="M 80 120 L 120 140 L 150 160 L 120 180 L 90 160 Z" fill="url(#suitGradient)" stroke="#1a252f" stroke-width="1"/>
  <path d="M 220 120 L 180 140 L 150 160 L 180 180 L 210 160 Z" fill="url(#suitGradient)" stroke="#1a252f" stroke-width="1"/>
  
  <!-- Shirt -->
  <path d="M 120 140 L 180 140 L 185 180 L 185 300 L 115 300 L 115 180 Z" fill="url(#shirtGradient)" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Tie -->
  <path d="M 140 150 L 160 150 L 165 170 L 160 280 L 150 290 L 140 280 L 135 170 Z" fill="url(#tieGradient)" stroke="#b8941f" stroke-width="1"/>
  
  <!-- Tie pattern -->
  <circle cx="150" cy="180" r="3" fill="#fff" opacity="0.3"/>
  <circle cx="150" cy="200" r="3" fill="#fff" opacity="0.3"/>
  <circle cx="150" cy="220" r="3" fill="#fff" opacity="0.3"/>
  <circle cx="150" cy="240" r="3" fill="#fff" opacity="0.3"/>
  
  <!-- Jacket buttons -->
  <circle cx="150" cy="200" r="4" fill="#1a252f" stroke="#d4af37" stroke-width="1"/>
  <circle cx="150" cy="240" r="4" fill="#1a252f" stroke="#d4af37" stroke-width="1"/>
  
  <!-- Pocket details -->
  <rect x="180" y="220" width="25" height="15" fill="none" stroke="#1a252f" stroke-width="1" rx="2"/>
  
  <!-- Dress pants -->
  <rect x="100" y="340" width="100" height="50" fill="url(#suitGradient)" stroke="#1a252f" stroke-width="2" rx="5"/>
  
  <!-- Text label -->
  <text x="150" y="30" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#b8941f">Men's Semi-Formal</text>
  <text x="150" y="50" text-anchor="middle" font-family="serif" font-size="14" fill="#4a3728">Suit or Dress Shirt with Slacks</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="80" r="3" fill="#d4af37" opacity="0.5"/>
  <circle cx="250" cy="80" r="3" fill="#d4af37" opacity="0.5"/>
  <circle cx="50" cy="320" r="3" fill="#d4af37" opacity="0.5"/>
  <circle cx="250" cy="320" r="3" fill="#d4af37" opacity="0.5"/>
</svg>